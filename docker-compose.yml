services:
  db:
    image: postgres:16-alpine
    container_name: oscar_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oscar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oscar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oscar_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ./database/indices.sql:/docker-entrypoint-initdb.d/02_indices.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql

volumes:
  postgres_data:
